
<!DOCTYPE html>
<html>
<head>
    <title>Multiplication Tables</title>
</head>
<body>

    <h2>Tables from 2 to 5</h2>

    <script>
        for (let i = 2; i <= 5; i++) {
            document.write("<h3>Table of " + i + "</h3>");

            for (let j = 1; j <= 10; j++) {
                document.write(
                    i + " x " + j + " = " + (i * j) + "<br>"
                );
            }
        }
    </script>

</body>
</html>
