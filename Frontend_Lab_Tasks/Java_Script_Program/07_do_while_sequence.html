
<!DOCTYPE html>
<html>
<head>
    <title>Do While Sequence</title>
</head>
<body>

    <h2>Sequence from 5 to 100</h2>

    <script>
        let i = 5;
        let sum = 0;

        do {
            document.write(i + "<br>");

            sum = sum + i;

            i = i + 5;

        } while (i <= 100);

        document.write("<h3>Total Sum: " + sum + "</h3>");
    </script>

</body>
</html>
