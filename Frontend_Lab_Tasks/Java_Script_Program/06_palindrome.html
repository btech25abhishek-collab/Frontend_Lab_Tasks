
<!DOCTYPE html>
<html>
<head>
    <title>Palindrome Number</title>
</head>
<body>

    <h2>Check Palindrome Number</h2>

    <script>
        let num = 123321;
        let original = num;
        let reverse = 0;

        while (num > 0) {
            let digit = num % 10;

            reverse = reverse * 10 + digit;

            num = Math.floor(num / 10);
        }

        if (original == reverse) {
            document.write(original + " is a Palindrome");
        }
        else {
            document.write(original + " is not a Palindrome");
        }
    </script>

</body>
</html>
