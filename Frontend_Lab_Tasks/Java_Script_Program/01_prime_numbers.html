
<!DOCTYPE html>
<html>
<head>
    <title>Prime Numbers</title>
</head>
<body>

    <h2>Prime Numbers Between 1 and 100</h2>

    <script>
        for (let num = 2; num <= 100; num++) {
            let count = 0;

            for (let i = 1; i <= num; i++) {
                if (num % i == 0) {
                    count++;
                }
            }

            if (count == 2) {
                document.write(num + "<br>");
            }
        }
    </script>

</body>
</html>
