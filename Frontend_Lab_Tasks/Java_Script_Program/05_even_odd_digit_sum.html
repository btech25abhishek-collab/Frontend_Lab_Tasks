
<!DOCTYPE html>
<html>
<head>
    <title>Even Odd Digit Sum</title>
</head>
<body>

    <h2>Sum of Even and Odd Digits</h2>

    <script>
        let num = 5837462;

        let evenSum = 0;
        let oddSum = 0;

        while (num > 0) {
            let digit = num % 10;

            if (digit % 2 == 0) {
                evenSum += digit;
            }
            else {
                oddSum += digit;
            }

            num = Math.floor(num / 10);
        }

        document.write("Even Digit Sum: " + evenSum + "<br>");
        document.write("Odd Digit Sum: " + oddSum);
    </script>

</body>
</html>
