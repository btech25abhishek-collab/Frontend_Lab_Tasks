
<!DOCTYPE html>
<html>
<head>
    <title>Array Operations</title>
</head>
<body>

    <h2>Array Operations</h2>

    <script>
        let arr = [10, -5, 0, 20, -15, 0, 30, -10];

        let positiveSum = 0;
        let negativeSum = 0;
        let zeroCount = 0;

        for (let i = 0; i < arr.length; i++) {

            if (arr[i] > 0) {
                positiveSum += arr[i];
            }
            else if (arr[i] < 0) {
                negativeSum += arr[i];
            }
            else {
                zeroCount++;
            }
        }

        document.write("Array: " + arr + "<br>");
        document.write("Positive Sum: " + positiveSum + "<br>");
        document.write("Negative Sum: " + negativeSum + "<br>");
        document.write("Zero Count: " + zeroCount);
    </script>

</body>
</html>
